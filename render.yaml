services:
  - type: web
    name: swasthya-twin
    runtime: python
    plan: free
    # Build React frontend with Vite base path /app/, then copy to static folder
    buildCommand: pip install -r requirements.txt && cd working && npm install && npm run build && cd .. && rm -rf static && cp -r working/dist static
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12
      - key: NODE_VERSION
        value: 20
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
    healthCheckPath: /health
